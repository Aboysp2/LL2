<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>لاباركوه للغات — تعلم الفرنسية</title>
<meta name="description" content="تطبيق تفاعلي لتعلم الفرنسية للناطقين بالعربية: النطق، القواعد، الحوارات و15 قصة قصيرة." />
<meta name="theme-color" content="#16233F" />
<link rel="manifest" href="manifest.json" />
<link rel="icon" href="icons/favicon-32.png" sizes="32x32" type="image/png" />
<link rel="icon" href="icons/favicon-16.png" sizes="16x16" type="image/png" />
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&family=Lora:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet" />
<style>
:root{
  --brand:#16233F;
  --brand-2:#223357;
  --ink:#16233F;
  --ink-2:#223357;
  --ink-soft:#42506E;
  --paper:#EEF2F0;
  --surface:#FFFFFF;
  --gold:#E3A857;
  --gold-deep:#B87F2E;
  --gold-tint:#FBEBD4;
  --teal:#3F7C74;
  --teal-tint:#E3F0EE;
  --clay:#B4502E;
  --line:#DDE3E0;
  --muted:#5B6B72;
  --radius-lg:20px;
  --radius-md:14px;
  --radius-sm:10px;
  --shadow-float:0 10px 30px rgba(22,35,63,0.18);
  --shadow-soft:0 2px 10px rgba(22,35,63,0.08);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --ink:#EEF2F0;
    --ink-2:#D8E0DC;
    --ink-soft:#AEB9C4;
    --paper:#0F1626;
    --surface:#182236;
    --gold:#E8B36B;
    --gold-deep:#F0C68A;
    --gold-tint:#2B2417;
    --teal:#6FBDB2;
    --teal-tint:#122824;
    --clay:#E08363;
    --line:#2B3650;
    --muted:#93A0AC;
    --shadow-float:0 10px 30px rgba(0,0,0,0.45);
    --shadow-soft:0 2px 10px rgba(0,0,0,0.3);
  }
}
:root[data-theme="dark"]{
  --ink:#EEF2F0; --ink-2:#D8E0DC; --ink-soft:#AEB9C4; --paper:#0F1626; --surface:#182236;
  --gold:#E8B36B; --gold-deep:#F0C68A; --gold-tint:#2B2417; --teal:#6FBDB2; --teal-tint:#122824;
  --clay:#E08363; --line:#2B3650; --muted:#93A0AC;
  --shadow-float:0 10px 30px rgba(0,0,0,0.45); --shadow-soft:0 2px 10px rgba(0,0,0,0.3);
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:var(--paper);
  color:var(--ink);
  font-family:'Cairo',system-ui,sans-serif;
  -webkit-font-smoothing:antialiased;
  min-height:100vh;
  min-height:100dvh;
}
.fr{ font-family:'Lora',Georgia,serif; direction:ltr; unicode-bidi:isolate; }
button{font-family:inherit;}
a{color:inherit;}
::selection{background:var(--gold-tint);color:var(--ink);}

#app-shell{
  max-width:480px;
  margin:0 auto;
  min-height:100vh;
  min-height:100dvh;
  position:relative;
  background:var(--paper);
  display:flex;
  flex-direction:column;
  box-shadow:0 0 60px rgba(0,0,0,0.06);
}

.topbar{
  position:sticky; top:0; z-index:20;
  background:var(--brand);
  color:#fff;
  padding:14px 18px calc(14px + env(safe-area-inset-top,0px)) 18px;
  padding-top:calc(14px + env(safe-area-inset-top,0px));
  display:flex; align-items:center; justify-content:space-between;
  border-bottom:1px solid rgba(255,255,255,0.06);
}
.brand{display:flex; align-items:center; gap:10px;}
.brand-mark{width:34px;height:34px;border-radius:9px;overflow:hidden;flex:none;background:var(--brand-2);}
.brand-mark img{width:100%;height:100%;object-fit:cover;display:block;}
.brand-text{display:flex; flex-direction:column; line-height:1.15;}
.brand-text b{font-size:15px; font-weight:800;}
.brand-text span{font-size:11px; color:#C9D3E0; font-weight:500;}
.streak-chip{
  display:flex; align-items:center; gap:6px;
  background:rgba(255,255,255,0.08);
  border:1px solid rgba(255,255,255,0.14);
  padding:6px 10px; border-radius:999px;
  font-size:12.5px; font-weight:700; color:var(--gold);
}
.streak-chip svg{width:15px;height:15px;flex:none;}

main#view{
  flex:1;
  padding:18px 16px 100px 16px;
  overflow-x:hidden;
}

/* ---------- Bottom nav ---------- */
.bottomnav{
  position:fixed; bottom:0; left:0; right:0;
  max-width:480px; margin:0 auto;
  background:var(--surface);
  border-top:1px solid var(--line);
  display:flex;
  padding:8px 6px calc(8px + env(safe-area-inset-bottom,0px)) 6px;
  box-shadow:var(--shadow-float);
  z-index:30;
}
.navbtn{
  flex:1; display:flex; flex-direction:column; align-items:center; gap:3px;
  background:none; border:none; padding:6px 2px; border-radius:12px; cursor:pointer;
  color:var(--muted); font-size:11px; font-weight:600;
  transition:color .15s ease;
}
.navbtn svg{width:22px;height:22px;stroke:currentColor;}
.navbtn.active{color:var(--gold-deep);}

/* ---------- Cards & sections ---------- */
.section-title{
  font-size:13px; font-weight:800; color:var(--muted);
  margin:22px 2px 10px 2px; display:flex; align-items:center; justify-content:space-between;
}
.section-title:first-child{margin-top:0;}
.card{
  background:var(--surface);
  border:1px solid var(--line);
  border-radius:var(--radius-md);
  padding:16px;
}
.card + .card{margin-top:10px;}

/* Hero */
.hero{
  background:linear-gradient(160deg, var(--brand) 0%, var(--brand-2) 100%);
  color:#fff;
  border-radius:var(--radius-lg);
  padding:20px;
  position:relative;
  overflow:hidden;
}
.hero::after{
  content:"";
  position:absolute; inset:auto -40px -60px auto;
  width:180px;height:180px;border-radius:50%;
  background:radial-gradient(circle, rgba(227,168,87,0.22), transparent 70%);
}
.hero h1{font-size:19px;margin:0 0 4px 0;font-weight:800;}
.hero p{margin:0; font-size:13px; color:#C9D3E0; line-height:1.6;}
.hero-row{display:flex; align-items:center; gap:16px; margin-top:16px;}
.ring{width:64px;height:64px;flex:none; position:relative;}
.ring svg{width:100%;height:100%;transform:rotate(-90deg);}
.ring-label{
  position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
  font-size:13px; font-weight:800; color:#fff;
}
.hero-stats{display:flex; flex-direction:column; gap:2px;}
.hero-stats b{font-size:14px;}
.hero-stats span{font-size:12px; color:#C9D3E0;}
.cta{
  display:inline-flex; align-items:center; gap:8px;
  background:var(--gold); color:var(--brand);
  font-weight:800; font-size:14px;
  border:none; border-radius:999px;
  padding:11px 18px; margin-top:16px; cursor:pointer;
  width:100%; justify-content:center;
}
.cta:active{transform:scale(0.98);}
.cta svg{width:18px;height:18px;flex:none;}
.cta.ghost{background:transparent; border:1.5px solid var(--line); color:var(--ink);}
.cta.small{width:auto; padding:8px 14px; font-size:13px;}

/* Chapters / lesson rows */
.chapter{
  background:var(--surface); border:1px solid var(--line); border-radius:var(--radius-md);
  margin-bottom:10px; overflow:hidden;
}
.chapter-head{
  display:flex; align-items:center; justify-content:space-between;
  padding:14px 16px; cursor:pointer; gap:10px;
}
.chapter-head h3{margin:0; font-size:15px; font-weight:800;}
.chapter-head .sub{font-size:12px; color:var(--muted); font-weight:600; margin-top:2px;}
.chapter-progress{
  width:34px;height:34px; border-radius:50%; flex:none;
  display:flex; align-items:center; justify-content:center;
  background:var(--paper); font-size:11px; font-weight:800; color:var(--ink-soft);
  border:1px solid var(--line);
}
.chapter-body{
  border-top:1px solid var(--line);
  display:none;
}
.chapter.open .chapter-body{display:block;}
.chapter.open .chev{transform:rotate(180deg);}
.chev{transition:transform .18s ease; flex:none;}

.lesson-row{
  display:flex; align-items:center; gap:12px;
  padding:12px 16px; cursor:pointer; border-bottom:1px solid var(--line);
}
.lesson-row:last-child{border-bottom:none;}
.lesson-row:active{background:var(--paper);}
.lesson-num{
  width:28px;height:28px;border-radius:50%; flex:none;
  display:flex; align-items:center; justify-content:center;
  font-size:12px; font-weight:800; background:var(--paper); color:var(--ink-soft);
  border:1px solid var(--line);
}
.lesson-row.done .lesson-num{background:var(--teal); color:#fff; border-color:var(--teal);}
.lesson-title{flex:1; font-size:14px; font-weight:700;}
.lesson-goal{font-size:11.5px; color:var(--muted); font-weight:500; margin-top:1px;}
.arrow-ic{flex:none; color:var(--muted);}

/* Reading list (dialogues/stories) */
.read-card{
  display:flex; align-items:center; gap:12px;
  background:var(--surface); border:1px solid var(--line); border-radius:var(--radius-md);
  padding:13px 14px; margin-bottom:9px; cursor:pointer;
}
.read-card:active{background:var(--paper);}
.read-badge{
  width:38px;height:38px;border-radius:11px;flex:none;
  display:flex;align-items:center;justify-content:center;
  background:var(--teal-tint); color:var(--teal); font-weight:800; font-size:14px;
}
.read-card.done .read-badge{background:var(--teal); color:#fff;}
.read-title{font-size:14px; font-weight:700;}
.read-sub{font-size:11.5px; color:var(--muted); margin-top:1px;}

/* Tabs (dialogues / stories switch) */
.subtabs{display:flex; gap:8px; margin-bottom:14px;}
.subtab{
  flex:1; text-align:center; padding:9px; border-radius:999px; font-size:13px; font-weight:700;
  background:var(--surface); border:1px solid var(--line); color:var(--muted); cursor:pointer;
}
.subtab.active{background:var(--brand); color:#fff; border-color:var(--brand);}

/* Sheet (bottom modal) */
.sheet-overlay{
  position:fixed; inset:0; background:rgba(15,20,30,0.5);
  display:none; align-items:flex-end; justify-content:center; z-index:50;
}
.sheet-overlay.open{display:flex;}
.sheet{
  position:relative;
  background:var(--paper); width:100%; max-width:480px;
  max-height:88vh; overflow-y:auto;
  border-radius:22px 22px 0 0;
  padding:10px 18px calc(28px + env(safe-area-inset-bottom,0px)) 18px;
  animation:slideup .22s ease;
}
@keyframes slideup{from{transform:translateY(24px);opacity:0;} to{transform:translateY(0);opacity:1;}}
.sheet-handle{width:38px;height:4px;background:var(--line); border-radius:99px; margin:8px auto 14px auto;}
.sheet h2{font-size:18px; margin:0 0 2px 0; font-weight:800;}
.sheet .goal-tag{
  display:inline-block; background:var(--gold-tint); color:var(--gold-deep);
  font-size:12px; font-weight:700; padding:5px 10px; border-radius:999px; margin:8px 0 14px 0;
}
.rule-box{
  background:var(--surface); border:1px solid var(--line); border-radius:var(--radius-md);
  padding:13px 14px; font-size:13.5px; line-height:1.9; color:var(--ink-soft); margin-bottom:14px;
}
.example{
  display:flex; align-items:center; gap:10px;
  background:var(--surface); border:1px solid var(--line); border-radius:var(--radius-sm);
  padding:11px 12px; margin-bottom:8px;
}
.example-text{flex:1;}
.example .fr{display:block; font-size:15.5px; font-weight:600; color:var(--ink);}
.example .ar{display:block; font-size:12.5px; color:var(--muted); margin-top:2px;}
.speak-btn{
  flex:none; width:34px;height:34px; border-radius:50%; border:1px solid var(--line);
  background:var(--paper); display:flex; align-items:center; justify-content:center; cursor:pointer; color:var(--ink-soft);
}
.speak-btn:active{background:var(--gold-tint); color:var(--gold-deep); border-color:var(--gold-tint);}
.speak-btn svg{width:16px;height:16px;}
.speak-btn.big{width:44px;height:44px;}
.speak-btn.big svg{width:19px;height:19px;}

.exercise-box{
  background:var(--teal-tint); border:1px dashed var(--teal);
  border-radius:var(--radius-md); padding:13px 14px; margin-top:16px;
}
.exercise-box .lbl{font-size:12px; font-weight:800; color:var(--teal); margin-bottom:6px;}
.exercise-box p{margin:0; font-size:13.5px; color:var(--ink); line-height:1.8;}
.exercise-box textarea{
  width:100%; margin-top:10px; border:1px solid var(--line); border-radius:10px;
  padding:9px 10px; font-family:inherit; font-size:13.5px; resize:vertical; min-height:54px;
  background:var(--surface); color:var(--ink);
}
.reveal-link{
  background:none;border:none;color:var(--teal);font-weight:800;font-size:12.5px;
  padding:0; margin-top:8px; cursor:pointer; text-decoration:underline;
}
.model-answer{
  margin-top:8px; font-size:13px; background:var(--surface); border-radius:8px; padding:9px 10px;
  border:1px solid var(--line); display:none;
}
.model-answer.show{display:block;}

.mark-done-row{display:flex; gap:10px; margin-top:18px;}

/* Story / dialogue reader */
.story-fr{
  background:var(--surface); border:1px solid var(--line); border-radius:var(--radius-md);
  padding:16px; margin-bottom:12px;
}
.story-fr p.fr{font-size:16px; line-height:1.85; margin:0;}
.story-ar{
  background:var(--gold-tint); border-radius:var(--radius-md); padding:16px; margin-bottom:14px;
  display:none;
}
.story-ar.show{display:block;}
.story-ar p{margin:0; font-size:14px; line-height:1.9; color:var(--ink);}
.toggle-ar{
  display:inline-flex; align-items:center; gap:6px;
  font-size:12.5px; font-weight:700; color:var(--gold-deep); background:var(--gold-tint);
  border:none; border-radius:999px; padding:8px 14px; cursor:pointer; margin-bottom:12px;
}
.dialogue-line{display:flex; gap:10px; align-items:flex-start; margin-bottom:12px;}
.dialogue-line .who{
  width:26px;height:26px;border-radius:50%;flex:none; background:var(--brand); color:#fff;
  display:flex;align-items:center;justify-content:center; font-size:11px; font-weight:800;
}
.dialogue-line.b .who{background:var(--gold); color:var(--brand);}
.dialogue-bubble{background:var(--surface); border:1px solid var(--line); border-radius:14px; padding:10px 12px; flex:1;}

.q-box{
  background:var(--surface); border:1px solid var(--line); border-radius:var(--radius-md);
  padding:13px 14px; margin-top:6px;
}
.q-box .lbl{font-size:12px; font-weight:800; color:var(--muted); margin-bottom:4px;}

/* Dictionary */
.search-wrap{position:relative; margin-bottom:14px;}
.search-wrap input{
  width:100%; padding:12px 42px 12px 14px; border-radius:999px; border:1px solid var(--line);
  background:var(--surface); font-family:inherit; font-size:14px; color:var(--ink);
}
.search-wrap svg{position:absolute; inset-inline-end:14px; top:50%; transform:translateY(-50%); width:18px;height:18px; color:var(--muted);}
.dict-row{
  display:flex; align-items:center; gap:10px; padding:11px 4px; border-bottom:1px solid var(--line);
}
.dict-row .fr{font-size:15px; font-weight:600;}
.dict-row .ar{font-size:12.5px; color:var(--muted); margin-top:1px;}
.dict-cat{font-size:10.5px; font-weight:800; color:var(--gold-deep); background:var(--gold-tint); padding:3px 8px; border-radius:999px; margin-inline-start:auto; flex:none;}

/* Quiz */
.quiz-item{background:var(--surface); border:1px solid var(--line); border-radius:var(--radius-md); padding:15px; margin-bottom:12px;}
.quiz-item .qn{font-size:12px; font-weight:800; color:var(--gold-deep); margin-bottom:6px;}
.quiz-item p.question{margin:0 0 10px 0; font-size:14.5px; font-weight:700; line-height:1.7;}
.quiz-item textarea{
  width:100%; border:1px solid var(--line); border-radius:10px; padding:9px 10px;
  font-family:inherit; font-size:13.5px; min-height:50px; background:var(--paper); color:var(--ink);
}
.progress-bar{height:8px; border-radius:99px; background:var(--line); overflow:hidden; margin:10px 0 18px 0;}
.progress-bar > div{height:100%; background:linear-gradient(90deg, var(--gold), var(--teal));}

.plan-row{display:flex; align-items:center; gap:10px; padding:10px 4px; border-bottom:1px solid var(--line);}
.plan-row:last-child{border-bottom:none;}
.plan-check{
  width:24px;height:24px;border-radius:7px;border:1.5px solid var(--line); flex:none; cursor:pointer;
  display:flex;align-items:center;justify-content:center; background:var(--surface);
}
.plan-check.checked{background:var(--teal); border-color:var(--teal); color:#fff;}
.plan-days{font-size:11px; font-weight:800; color:var(--muted); width:56px; flex:none; white-space:nowrap;}
.plan-text{font-size:13px; font-weight:600;}

.empty-note{text-align:center; color:var(--muted); font-size:13px; padding:30px 10px;}

.toast{
  position:fixed; bottom:96px; left:50%; transform:translateX(-50%) translateY(12px);
  background:var(--ink); color:#fff; padding:10px 18px; border-radius:999px; font-size:13px; font-weight:700;
  opacity:0; pointer-events:none; transition:all .25s ease; z-index:60; white-space:nowrap;
  box-shadow:var(--shadow-float);
}
.toast.show{opacity:1; transform:translateX(-50%) translateY(0);}

.close-sheet{
  position:absolute; top:14px; inset-inline-end:14px;
  width:32px;height:32px;border-radius:50%; border:1px solid var(--line); background:var(--surface);
  display:flex;align-items:center;justify-content:center; cursor:pointer; color:var(--ink-soft);
}

::-webkit-scrollbar{width:0;height:0;}
</style>
</head>
<body>
<div id="app-shell">

  <header class="topbar">
    <div class="brand">
      <div class="brand-mark"><img src="icons/icon-192.png" alt="" /></div>
      <div class="brand-text">
        <b>لاباركوه للغات</b>
        <span>الفرنسية ببساطة</span>
      </div>
    </div>
    <div class="streak-chip" id="streakChip">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2c1 4-3 5-3 9a3 3 0 0 0 6 0c0-1-.5-2-1-3 1.5.7 3 2.5 3 5a5 5 0 0 1-10 0c0-4 3-6 5-11z"/></svg>
      <span id="streakVal">0</span>
    </div>
  </header>

  <main id="view"></main>

  <nav class="bottomnav">
    <button class="navbtn" data-route="home">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11.5 12 4l9 7.5"/><path d="M5 10v9a1 1 0 0 0 1 1h4v-6h4v6h4a1 1 0 0 0 1-1v-9"/></svg>
      <span>الرئيسية</span>
    </button>
    <button class="navbtn" data-route="lessons">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5V5.2C4 4.5 4.6 4 5.3 4H12v16H5.3c-.7 0-1.3.5-1.3 1"/><path d="M20 19.5V5.2c0-.7-.6-1.2-1.3-1.2H12v16h6.7c.7 0 1.3.5 1.3 1"/></svg>
      <span>الدروس</span>
    </button>
    <button class="navbtn" data-route="reading">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 20l1-5.6a8.38 8.38 0 0 1-.9-3.9 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/></svg>
      <span>قراءة</span>
    </button>
    <button class="navbtn" data-route="quiz">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="m9 12 2 2 4-4"/><circle cx="12" cy="12" r="9"/></svg>
      <span>الاختبار</span>
    </button>
    <button class="navbtn" data-route="dictionary">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
      <span>القاموس</span>
    </button>
  </nav>

  <div class="sheet-overlay" id="sheetOverlay">
    <div class="sheet" id="sheet"></div>
  </div>
  <div class="toast" id="toast"></div>
</div>

<script>
/* ======================= DATA ======================= */
const LEVELS_META = {
  A1:{title:"A1", desc:"المبتدئ", subs:{

const LEVEL_RANGES = [
  [1,4,'A1',1],[5,8,'A1',2],[9,12,'A1',3],[13,15,'A1',4],
  [16,19,'A2',1],[20,23,'A2',2],[24,27,'A2',3],[28,34,'A2',4],
  [35,37,'B1',1],[38,40,'B1',2],[41,43,'B1',3],[44,46,'B1',4],
  [47,49,'B2',1],[50,52,'B2',2],[53,55,'B2',3],[56,58,'B2',4],
];
function levelOf(n){
  for(const [a,b,lvl,sub] of LEVEL_RANGES){ if(n>=a && n<=b) return {level:lvl, sub}; }
  return {level:'A1', sub:1};
}

   {fr:"Elle lisait un livre quand je suis arrivé.", ar:"كانت تقرأ كتابا عندما وصلت."},
   {fr:"Nous étions fatigués après le voyage.", ar:"كنا متعبين بعد السفر."},
 ],
 exercise:"اكتب قصة قصيرة من جملتين تجمع بين الزمنين."},
{n:37, title:"المقارنة والتفضيل", goal:"استخدام plus / moins / aussi ... que و le plus / le moins",
 rule:"المقارنة: plus...que (أكثر من)، moins...que (أقل من)، aussi...que (بقدر). التفضيل: le/la plus...، le/la moins....",
 examples:[
   {fr:"Paris est plus grand que Lyon.", ar:"باريس أكبر من ليون."},
   {fr:"Elle est aussi rapide que lui.", ar:"هي سريعة بقدره."},
   {fr:"C'est le plus beau jour de l'année.", ar:"إنه أجمل يوم في السنة."},
   {fr:"C'est le moins cher du magasin.", ar:"إنه الأرخص في المتجر."},
 ],
 exercise:"قارن بين مدينتين تعرفهما بجملتين."},

{n:38, title:"النصيحة: il faut و devoir", goal:"تقديم نصيحة أو التزام",
 rule:"il faut + مصدر = يجب (عام). devoir + مصدر = يجب على شخص محدد. tu devrais = ينصح بلطف.",
 examples:[
   {fr:"Il faut dormir tôt.", ar:"يجب النوم مبكرا."},
   {fr:"Tu dois travailler plus.", ar:"يجب أن تعمل أكثر."},
   {fr:"Tu devrais voir un médecin.", ar:"من الأفضل أن ترى طبيبا."},
   {fr:"Nous devons partir maintenant.", ar:"يجب أن نغادر الآن."},
 ],
 exercise:"أعطِ نصيحتين لصديق يشعر بالتعب."},
{n:39, title:"الشرط الحاضر (conditionnel)", goal:"التعبير عن رغبة أو افتراض مهذّب",
 rule:"يُبنى من مصدر الفعل + نهايات الناقص: ais, ais, ait, ions, iez, aient. يُستخدم للتلطف أو الافتراض.",
 examples:[
   {fr:"Je voudrais un café, s'il vous plaît.", ar:"أود قهوة من فضلك."},
   {fr:"J'aimerais voyager en France.", ar:"أحب أن أسافر إلى فرنسا."},
   {fr:"Pourrais-tu m'aider ?", ar:"هل يمكنك مساعدتي؟ (بأدب)"},
   {fr:"À ta place, je resterais.", ar:"لو كنت مكانك، لبقيت."},
 ],
 exercise:"اكتب طلبا مهذبا باستخدام الشرط الحاضر."},
{n:40, title:"الجملة الشرطية مع si", goal:"التعبير عن شرط ونتيجته",
 rule:"si + حاضر → حاضر أو مستقبل قريب (شرط واقعي). si + ناقص → شرط حاضر (شرط افتراضي).",
 examples:[
   {fr:"Si tu es fatigué, repose-toi.", ar:"إذا كنت متعبا، فارتَح."},
   {fr:"S'il fait beau, nous sortirons.", ar:"إذا كان الجو جميلا، سنخرج."},
   {fr:"Si j'avais le temps, je voyagerais.", ar:"لو كان لدي وقت، لسافرت."},
   {fr:"Si j'étais riche, j'achèterais une maison.", ar:"لو كنت غنيا، لاشتريت بيتا."},
 ],
 exercise:"اكتب جملة شرطية واقعية وأخرى افتراضية."},

{n:41, title:"التعبير عن الرأي", goal:"صياغة رأي بوضوح",
 rule:"عبارات مفيدة: je pense que, à mon avis, je trouve que, selon moi.",
 examples:[
   {fr:"Je pense que c'est une bonne idée.", ar:"أعتقد أنها فكرة جيدة."},
   {fr:"À mon avis, il a raison.", ar:"في رأيي، هو محق."},
   {fr:"Je trouve ce film intéressant.", ar:"أجد هذا الفيلم مثيرا للاهتمام."},
   {fr:"Selon moi, ce n'est pas juste.", ar:"في رأيي، هذا ليس عادلا."},
 ],
 exercise:"اكتب رأيك في موضوع يهمك بجملتين."},
{n:42, title:"الضمائر الموصولة qui / que / où", goal:"ربط جملتين بضمير موصول",
 rule:"qui يعوّض فاعلا، que يعوّض مفعولا، où يعوّض مكانا أو زمانا.",
 examples:[
   {fr:"J'ai un ami qui habite à Nice.", ar:"لدي صديق يسكن في نيس."},
   {fr:"Le livre que je lis est passionnant.", ar:"الكتاب الذي أقرأه ممتع."},
   {fr:"C'est la ville où je suis né.", ar:"إنها المدينة التي وُلدت فيها."},
   {fr:"Voici la maison où j'ai grandi.", ar:"هذا هو البيت الذي كبرت فيه."},
 ],
 exercise:"اربط جملتين من عندك باستخدام qui أو que."},
{n:43, title:"المشاعر والأحاسيس", goal:"التعبير عن الشعور بدقة",
 rule:"استخدم être + صفة الشعور، أو avoir + اسم في بعض التعابير الثابتة.",
 examples:[
   {fr:"Je suis content(e) de te voir.", ar:"أنا سعيد لرؤيتك."},
   {fr:"Elle est triste aujourd'hui.", ar:"هي حزينة اليوم."},
   {fr:"J'ai peur des araignées.", ar:"أخاف من العناكب."},
   {fr:"Nous sommes fiers de toi.", ar:"نحن فخورون بك."},
 ],
 exercise:"صف شعورك اليوم في جملتين."},

{n:44, title:"عند الطبيب", goal:"وصف الحالة الصحية وطلب المساعدة",
 rule:"عبارات أساسية: j'ai mal à..., je ne me sens pas bien, j'ai de la fièvre.",
 examples:[
   {fr:"J'ai mal à la tête.", ar:"أشعر بصداع."},
   {fr:"Je ne me sens pas bien.", ar:"لا أشعر أني بخير."},
   {fr:"J'ai de la fièvre depuis hier.", ar:"لدي حمى منذ الأمس."},
   {fr:"Le médecin m'a donné un médicament.", ar:"أعطاني الطبيب دواء."},
 ],
 exercise:"صف عرضا صحيا بسيطا وما تحتاجه."},
{n:45, title:"كتابة بريد إلكتروني بسيط", goal:"صياغة رسالة قصيرة ومهذبة",
 rule:"البنية: تحية (Bonjour / Madame, Monsieur) — الغرض — خاتمة (Cordialement).",
 examples:[
   {fr:"Bonjour, je vous écris au sujet de...", ar:"مرحبا، أكتب إليكم بخصوص..."},
   {fr:"Merci de votre réponse rapide.", ar:"شكرا لردكم السريع."},
   {fr:"Pourriez-vous m'envoyer plus d'informations ?", ar:"هل يمكنكم إرسال مزيد من المعلومات؟"},
   {fr:"Cordialement,", ar:"مع أطيب التحيات،"},
 ],
 exercise:"اكتب بريدا إلكترونيا قصيرا من 4 أسطر."},
{n:46, title:"الطقس والفصول", goal:"وصف الجو والفصول بثقة",
 rule:"استخدم Il fait + صفة للجو، و Il y a + اسم للظواهر.",
 examples:[
   {fr:"Il fait chaud en été.", ar:"الجو حار في الصيف."},
   {fr:"Il pleut beaucoup en automne.", ar:"تمطر كثيرا في الخريف."},
   {fr:"Il y a du vent aujourd'hui.", ar:"هناك رياح اليوم."},
   {fr:"Il neige en hiver dans les montagnes.", ar:"تتساقط الثلوج شتاء في الجبال."},
 ],
 exercise:"صف طقس اليوم في مدينتك بجملتين."},

{n:47, title:"صيغة الشرط الجازم (subjonctif) — المدخل", goal:"التعرف إلى صيغة الشرط الجازم وسياقاتها",
 rule:"يُستخدم بعد عبارات مثل il faut que, je veux que, je souhaite que. يُبنى غالبا من جذر ils بالحاضر + e, es, e, ions, iez, ent.",
 examples:[
   {fr:"Il faut que tu partes maintenant.", ar:"يجب أن تغادر الآن."},
   {fr:"Je veux que tu sois heureux.", ar:"أريدك أن تكون سعيدا."},
   {fr:"Il faut que nous finissions ce travail.", ar:"يجب أن ننهي هذا العمل."},
   {fr:"Je souhaite qu'elle réussisse.", ar:"أتمنى أن تنجح."},
 ],
 exercise:"اكتب جملتين باستخدام il faut que."},
{n:48, title:"الشك والرغبة بالشرط الجازم", goal:"التعبير عن شك أو رغبة قوية",
 rule:"بعد أفعال الشك (douter que) والرغبة (vouloir que, souhaiter que) يأتي الفعل بصيغة الشرط الجازم.",
 examples:[
   {fr:"Je doute qu'il vienne à l'heure.", ar:"أشك أن يأتي في الوقت المحدد."},
   {fr:"Elle veut que nous restions.", ar:"تريد منا أن نبقى."},
   {fr:"Je ne pense pas qu'il ait raison.", ar:"لا أعتقد أنه محق."},
   {fr:"Il est possible qu'il pleuve demain.", ar:"من الممكن أن تمطر غدا."},
 ],
 exercise:"اكتب جملة شك وجملة رغبة بصيغة الشرط الجازم."},
{n:49, title:"المبني للمجهول", goal:"صياغة جملة بالمبني للمجهول",
 rule:"être + اسم المفعول. الفاعل الأصلي يصبح اختياريا بعد par.",
 examples:[
   {fr:"Le livre est écrit par un auteur célèbre.", ar:"الكتاب مكتوب من طرف مؤلف مشهور."},
   {fr:"La maison a été vendue.", ar:"بيع البيت."},
   {fr:"Ce plat est préparé avec amour.", ar:"يُحضَّر هذا الطبق بحب."},
   {fr:"Les billets seront envoyés demain.", ar:"ستُرسَل التذاكر غدا."},
 ],
 exercise:"حوّل جملة فاعلة إلى مبنية للمجهول."},

{n:50, title:"روابط متقدمة", goal:"استخدام bien que / alors que / cependant",
 rule:"bien que + شرط جازم يعبّر عن التنازل. alors que وcependant للتقابل.",
 examples:[
   {fr:"Bien qu'il pleuve, nous sortons.", ar:"رغم أنها تمطر، نخرج."},
   {fr:"Alors que je travaillais, il dormait.", ar:"بينما كنت أعمل، كان هو نائما."},
   {fr:"Cependant, ce n'est pas facile.", ar:"مع ذلك، ليس الأمر سهلا."},
   {fr:"Malgré la pluie, ils ont joué.", ar:"رغم المطر، لعبوا."},
 ],
 exercise:"اكتب جملة تنازل باستخدام bien que."},
{n:51, title:"الكلام المنقول", goal:"نقل كلام شخص آخر بشكل غير مباشر",
 rule:"il dit que + جملة (يبقى الزمن غالبا كما هو أو يتغيّر حسب زمن الفعل الأساسي).",
 examples:[
   {fr:"Il dit qu'il est fatigué.", ar:"يقول إنه متعب."},
   {fr:"Elle a dit qu'elle viendrait.", ar:"قالت إنها ستأتي."},
   {fr:"Ils ont expliqué pourquoi ils étaient en retard.", ar:"شرحوا لماذا كانوا متأخرين."},
   {fr:"Il m'a demandé si j'étais prêt.", ar:"سألني إن كنت مستعدا."},
 ],
 exercise:"انقل جملة قالها لك أحدهم بأسلوب غير مباشر."},
{n:52, title:"التعبير عن الاحتمال", goal:"صياغة تخمين أو احتمال",
 rule:"عبارات مفيدة: peut-être, il se peut que + شرط جازم, probablement.",
 examples:[
   {fr:"Il est peut-être en retard.", ar:"ربما هو متأخر."},
   {fr:"Il se peut qu'il pleuve.", ar:"من المحتمل أن تمطر."},
   {fr:"Elle arrivera probablement demain.", ar:"ستصل غدا على الأرجح."},
   {fr:"Il doit être fatigué après le voyage.", ar:"لا بد أنه متعب بعد السفر."},
 ],
 exercise:"اكتب تخمينين حول شيء تجهله بالضبط."},

{n:53, title:"بناء حجة", goal:"تنظيم رأي بأدلة",
 rule:"استخدم d'une part... d'autre part للتوازن، وde plus وen outre للإضافة، وen conclusion للختام.",
 examples:[
   {fr:"D'une part, c'est pratique. D'autre part, c'est cher.", ar:"من جهة، هذا عملي. من جهة أخرى، هذا مكلف."},
   {fr:"De plus, cela prend du temps.", ar:"إضافة إلى ذلك، هذا يستغرق وقتا."},
   {fr:"En conclusion, je préfère la première option.", ar:"في الختام، أفضّل الخيار الأول."},
   {fr:"Par exemple, regardons les chiffres.", ar:"على سبيل المثال، لننظر إلى الأرقام."},
 ],
 exercise:"اكتب فقرة قصيرة برأي مدعوم بحجتين."},
{n:54, title:"فهم مقال قصير", goal:"استخراج الفكرة الرئيسية من نص",
 rule:"اقرأ العنوان أولا، ثم الجملة الأولى من كل فقرة؛ غالبا تحمل الفكرة الأساسية.",
 examples:[
   {fr:"Le titre annonce souvent le sujet principal.", ar:"العنوان غالبا يعلن الموضوع الرئيسي."},
   {fr:"La première phrase résume l'idée du paragraphe.", ar:"الجملة الأولى تلخّص فكرة الفقرة."},
   {fr:"Les chiffres soutiennent l'argument.", ar:"الأرقام تدعم الحجة."},
   {fr:"La conclusion répond souvent à la question posée.", ar:"الخاتمة غالبا تجيب عن السؤال المطروح."},
 ],
 exercise:"اقرأ أحد نصوص «أخبار» في التطبيق ولخّصه بجملتين."},
{n:55, title:"تعابير اصطلاحية شائعة", goal:"فهم واستخدام تعابير غير حرفية",
 rule:"التعبير الاصطلاحي لا يُترجم حرفيا؛ احفظه كوحدة كاملة.",
 examples:[
   {fr:"Ça coûte les yeux de la tête.", ar:"ثمنه باهظ جدا (حرفيا: يكلّف عينَي الرأس)."},
   {fr:"Il pleut des cordes.", ar:"إنها تمطر بغزارة."},
   {fr:"Avoir le cafard.", ar:"الشعور بالحزن أو الملل."},
   {fr:"Poser un lapin à quelqu'un.", ar:"عدم الحضور إلى موعد مع أحد."},
 ],
 exercise:"استخدم تعبيرا اصطلاحيا واحدا في جملة من عندك."},

{n:56, title:"النقاش حول قضايا مجتمعية", goal:"التعبير عن موقف حول موضوع عام",
 rule:"استخدم عبارات محايدة: certains pensent que... / d'autres estiment que... لتقديم آراء متعددة.",
 examples:[
   {fr:"Certains pensent que la technologie isole les gens.", ar:"يعتقد البعض أن التكنولوجيا تعزل الناس."},
   {fr:"D'autres estiment qu'elle nous rapproche.", ar:"يرى آخرون أنها تقرّبنا."},
   {fr:"Il est important de protéger l'environnement.", ar:"من المهم حماية البيئة."},
   {fr:"Chacun a le droit d'exprimer son opinion.", ar:"لكل شخص الحق في التعبير عن رأيه."},
 ],
 exercise:"اكتب رأيين متعارضين حول موضوع مجتمعي تختاره."},
{n:57, title:"الأسلوب الرسمي والرسائل", goal:"التمييز بين الأسلوب الرسمي وغير الرسمي",
 rule:"الأسلوب الرسمي يستخدم vous وعبارات مثل je vous prie de... بدل الأسلوب اليومي.",
 examples:[
   {fr:"Je vous prie de bien vouloir m'excuser.", ar:"أرجو منكم قبول اعتذاري."},
   {fr:"Veuillez trouver ci-joint mon CV.", ar:"يرجى الاطلاع على سيرتي الذاتية المرفقة."},
   {fr:"Dans l'attente de votre réponse.", ar:"بانتظار ردكم."},
   {fr:"Je vous remercie de votre attention.", ar:"أشكركم على اهتمامكم."},
 ],
 exercise:"اكتب جملتين بأسلوب رسمي لطلب وظيفة."},
{n:58, title:"مراجعة شاملة وتقييم ذاتي B2", goal:"تثبيت ما تعلمته في المستوى B2",
 rule:"راجع الشرط الجازم، المبني للمجهول، الكلام المنقول، والروابط المتقدمة قبل الانتقال إلى مستوى أعلى.",
 examples:[
   {fr:"Je suis fier(ère) des progrès que j'ai faits.", ar:"أنا فخور بالتقدم الذي أحرزته."},
   {fr:"Il faut que je continue à pratiquer.", ar:"يجب أن أستمر في التمرن."},
   {fr:"J'aimerais atteindre le niveau C1 un jour.", ar:"أود أن أصل إلى المستوى C1 يوما ما."},
   {fr:"La pratique quotidienne fait toute la différence.", ar:"الممارسة اليومية تصنع كل الفرق."},
 ],
 exercise:"سجّل نفسك تتحدث 3 دقائق بالفرنسية عن تجربتك في تعلّم اللغة."},
];

/* ======================= STORAGE ======================= */
const STORE_KEY = "labarkouh_langues_v1";
function loadState(){
  try{
    const raw = localStorage.getItem(STORE_KEY);
    if(raw) return JSON.parse(raw);
  }catch(e){}
  return {lessons:{}, stories:{}, dialogues:{}, news:{}, quizDone:false, plan:{}, streak:{count:0,last:null}, xp:0};
}
function saveState(){
  try{ localStorage.setItem(STORE_KEY, JSON.stringify(state)); }catch(e){}
}
let state = loadState();
if(!state.news) state.news = {};

function todayStr(){ return new Date().toISOString().slice(0,10); }
function bumpStreak(){
  const today = todayStr();
  if(state.streak.last === today) return;
  const y = new Date(); y.setDate(y.getDate()-1);
  const yesterday = y.toISOString().slice(0,10);
  if(state.streak.last === yesterday){ state.streak.count += 1; }
  else { state.streak.count = 1; }
  state.streak.last = today;
  saveState();
}
function addXp(n){ state.xp = (state.xp||0) + n; saveState(); }

/* ======================= SPEECH ======================= */
let frVoice = null;
function pickVoice(){
  if(!('speechSynthesis' in window)) return;
  const voices = speechSynthesis.getVoices();
  frVoice = voices.find(v => v.lang && v.lang.toLowerCase().startsWith('fr')) || null;
}
if('speechSynthesis' in window){
  pickVoice();
  speechSynthesis.onvoiceschanged = pickVoice;
}
function speak(text){
  if(!('speechSynthesis' in window)){
    showToast("النطق الصوتي غير مدعوم في هذا المتصفح");
    return;
  }
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.lang = 'fr-FR';
  if(frVoice) u.voice = frVoice;
  u.rate = 0.92;
  speechSynthesis.speak(u);
}

/* ======================= HELPERS ======================= */
function showToast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(showToast._tm);
  showToast._tm = setTimeout(()=> t.classList.remove('show'), 1800);
}
function escapeHtml(s){
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function openSheet(html){
  document.getElementById('sheet').innerHTML = html;
  document.getElementById('sheetOverlay').classList.add('open');
}
function closeSheet(){
  document.getElementById('sheetOverlay').classList.remove('open');
  speechSynthesis && speechSynthesis.cancel();
}
document.getElementById('sheetOverlay').addEventListener('click', (e)=>{
  if(e.target.id === 'sheetOverlay') closeSheet();
});

function totalProgress(){
  const lessonsDone = Object.keys(state.lessons).length;
  const storiesDone = Object.keys(state.stories).length;
  const dialoguesDone = Object.keys(state.dialogues).length;
  const newsDone = Object.keys(state.news).length;
  const total = LESSONS.length + STORIES.length + DIALOGUES.length + NEWS.length + 1;
  const done = lessonsDone + storiesDone + dialoguesDone + newsDone + (state.quizDone?1:0);
  return {done, total, pct: Math.round((done/total)*100)};
}

/* ======================= ROUTER ======================= */
let currentRoute = 'home';
function navigate(route){
  currentRoute = route;
  document.querySelectorAll('.navbtn').forEach(b => b.classList.toggle('active', b.dataset.route===route));
  const view = document.getElementById('view');
  if(route==='lessons'){
    const nx = nextLesson();
    if(nx) currentLessonLevel = levelOf(nx.n).level;
  }
  if(route==='home') view.innerHTML = renderHome();
  else if(route==='lessons') view.innerHTML = renderLessons();
  else if(route==='reading') view.innerHTML = renderReading(currentReadingTab);
  else if(route==='quiz') view.innerHTML = renderQuiz();
  else if(route==='dictionary') view.innerHTML = renderDictionary();
  window.scrollTo(0,0);
  attachViewHandlers(route);
  updateStreakChip();
}
document.querySelectorAll('.navbtn').forEach(btn=>{
  btn.addEventListener('click', ()=> navigate(btn.dataset.route));
});
function updateStreakChip(){
  document.getElementById('streakVal').textContent = state.streak.count || 0;
}

/* ======================= HOME ======================= */
function nextLesson(){
  return LESSONS.find(l => !state.lessons[l.n]) || null;
}
function renderHome(){
  const p = totalProgress();
  const circ = 2*Math.PI*26;
  const offset = circ - (p.pct/100)*circ;
  const nx = nextLesson();
  const planDone = Object.keys(state.plan).length;
  return `
  <div class="hero">
    <h1>أهلا بك 👋</h1>
    <p>«الفرنسية ببساطة» — تعلّم بخطوات صغيرة كل يوم، من النطق إلى القصص القصيرة.</p>
    <div class="hero-row">
      <div class="ring">
        <svg viewBox="0 0 60 60">
          <circle cx="30" cy="30" r="26" stroke="rgba(255,255,255,0.18)" stroke-width="6" fill="none"/>
          <circle cx="30" cy="30" r="26" stroke="#E3A857" stroke-width="6" fill="none"
            stroke-dasharray="${circ}" stroke-dashoffset="${offset}" stroke-linecap="round"/>
        </svg>
        <div class="ring-label">${p.pct}%</div>
      </div>
      <div class="hero-stats">
        <b>${p.done} من ${p.total}</b>
        <span>وحدة مكتملة</span>
      </div>
    </div>
    ${nx ? `<button class="cta" id="continueBtn" data-n="${nx.n}">متابعة — الدرس ${nx.n}: ${nx.title}</button>`
         : `<button class="cta" id="goQuizBtn">أنهيت كل الدروس — إلى الاختبار النهائي</button>`}
  </div>

  <div class="section-title">خطة الثلاثين يوما</div>
  <div class="card">
    ${PLAN30.map((p,i)=>`
      <div class="plan-row">
        <div class="plan-check ${state.plan[i]?'checked':''}" data-plan="${i}">
          ${state.plan[i] ? '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><path d="m5 13 4 4L19 7"/></svg>' : ''}
        </div>
        <div class="plan-days">أيام ${p.days}</div>
        <div class="plan-text">${p.task}</div>
      </div>
    `).join('')}
  </div>

  <div class="section-title">نظرة سريعة</div>
  <div class="card" style="display:flex; gap:8px;">
    <div style="flex:1; text-align:center;">
      <div style="font-size:18px; font-weight:800; color:var(--teal);">${Object.keys(state.lessons).length}/${LESSONS.length}</div>
      <div style="font-size:11px; color:var(--muted); margin-top:2px;">دروس</div>
    </div>
    <div style="flex:1; text-align:center; border-right:1px solid var(--line); border-left:1px solid var(--line);">
      <div style="font-size:18px; font-weight:800; color:var(--teal);">${Object.keys(state.stories).length+Object.keys(state.dialogues).length+Object.keys(state.news).length}/${STORIES.length+DIALOGUES.length+NEWS.length}</div>
      <div style="font-size:11px; color:var(--muted); margin-top:2px;">قراءات</div>
    </div>
    <div style="flex:1; text-align:center;">
      <div style="font-size:18px; font-weight:800; color:var(--teal);">${state.xp||0}</div>
      <div style="font-size:11px; color:var(--muted); margin-top:2px;">نقطة خبرة</div>
    </div>
  </div>
  `;
}

/* ======================= LESSONS ======================= */
let currentLessonLevel = 'A1';
function renderLessons(){
  const levelIds = Object.keys(LEVELS_META);
  return `
  <div class="subtabs">
    ${levelIds.map(lv=>`<div class="subtab ${lv===currentLessonLevel?'active':''}" data-level="${lv}">${lv}</div>`).join('')}
  </div>
  <div id="levelBody">${renderLevelBody(currentLessonLevel)}</div>
  `;
}
function renderLevelBody(levelId){
  const meta = LEVELS_META[levelId];
  const subIds = Object.keys(meta.subs).map(Number).sort((a,b)=>a-b);
  return `
  <div class="section-title">${levelId} — ${meta.desc}</div>
  ${subIds.map(subId=>{
    const subMeta = meta.subs[subId];
    const subLessons = LESSONS.filter(l=>{ const lv = levelOf(l.n); return lv.level===levelId && lv.sub===subId; });
    const doneCount = subLessons.filter(l=>state.lessons[l.n]).length;
    const domId = levelId+'-'+subId;
    return `
    <div class="chapter" id="chapter-${domId}">
      <div class="chapter-head" data-toggle="${domId}">
        <div>
          <h3>${subMeta.title}</h3>
          <div class="sub">${subMeta.desc}</div>
        </div>
        <div style="display:flex; align-items:center; gap:8px;">
          <div class="chapter-progress">${doneCount}/${subLessons.length}</div>
          <svg class="chev" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg>
        </div>
      </div>
      <div class="chapter-body">
        ${subLessons.map(l=>`
          <div class="lesson-row ${state.lessons[l.n]?'done':''}" data-lesson="${l.n}">
            <div class="lesson-num">${state.lessons[l.n] ? '✓' : l.n}</div>
            <div style="flex:1;">
              <div class="lesson-title">${l.title}</div>
              <div class="lesson-goal">${l.goal}</div>
            </div>
            <svg class="arrow-ic" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 6-6 6 6 6"/></svg>
          </div>
        `).join('')}
      </div>
    </div>`;
  }).join('')}
  `;
}

function lessonSheetHtml(l){
  const done = !!state.lessons[l.n];
  return `
    <div class="close-sheet" data-close>✕</div>
    <div class="sheet-handle"></div>
    <div style="font-size:12px; font-weight:800; color:var(--muted);">الدرس ${l.n}</div>
    <h2>${l.title}</h2>
    <span class="goal-tag">${l.goal}</span>
    <div class="rule-box">${l.rule}</div>
    ${l.examples.map(ex=>`
      <div class="example">
        <div class="example-text">
          <span class="fr">${ex.fr}</span>
          <span class="ar">${ex.ar}</span>
        </div>
        <button class="speak-btn" data-speak="${escapeHtml(ex.speak || ex.fr)}">${SPEAK_ICON}</button>
      </div>
    `).join('')}
    <div class="exercise-box">
      <div class="lbl">تطبيق سريع</div>
      <p>${l.exercise}</p>
      <textarea placeholder="اكتب إجابتك هنا (اختياري)..."></textarea>
    </div>
    <div class="mark-done-row">
      <button class="cta ${done?'ghost':''}" id="markLessonBtn" data-n="${l.n}" style="flex:1;">
        ${done ? 'تم إنهاء هذا الدرس ✓' : 'أنهيت هذا الدرس'}
      </button>
    </div>
  `;
}

/* ======================= READING (dialogues / stories / news) ======================= */
let currentReadingTab = 'dialogues';
function renderReading(tab){
  const activeTab = tab || currentReadingTab;
  currentReadingTab = activeTab;
  return `
  <div class="subtabs">
    <div class="subtab ${activeTab==='dialogues'?'active':''}" data-readtab="dialogues">الحوارات</div>
    <div class="subtab ${activeTab==='stories'?'active':''}" data-readtab="stories">القصص</div>
    <div class="subtab ${activeTab==='news'?'active':''}" data-readtab="news">أخبار</div>
  </div>
  <div id="readingList">${renderReadingList(activeTab)}</div>
  `;
}
function renderReadingList(tab){
  if(tab==='dialogues'){
    return DIALOGUES.map(d=>`
      <div class="read-card ${state.dialogues[d.n]?'done':''}" data-dialogue="${d.n}">
        <div class="read-badge">${state.dialogues[d.n]?'✓':d.n}</div>
        <div>
          <div class="read-title">حوار ${d.n} — ${d.title}</div>
          <div class="read-sub">${d.lines.length} أسطر حوار</div>
        </div>
      </div>
    `).join('');
  }
  if(tab==='news'){
    return NEWS.map(s=>`
      <div class="read-card ${state.news[s.n]?'done':''}" data-news="${s.n}">
        <div class="read-badge">${state.news[s.n]?'✓':s.n}</div>
        <div>
          <div class="read-title">خبر ${s.n} — ${s.title}</div>
          <div class="read-sub">نص قصير للتدريب على القراءة</div>
        </div>
      </div>
    `).join('');
  }
  return STORIES.map(s=>`
    <div class="read-card ${state.stories[s.n]?'done':''}" data-story="${s.n}">
      <div class="read-badge">${state.stories[s.n]?'✓':s.n}</div>
      <div>
        <div class="read-title">قصة ${s.n} — ${s.title}</div>
        <div class="read-sub">اقرأ، استمع، ثم أجب عن سؤال الفهم</div>
      </div>
    </div>
  `).join('');
}

function dialogueSheetHtml(d){
  const done = !!state.dialogues[d.n];
  const fullText = d.lines.map(l=>l.fr).join(' ');
  return `
    <div class="close-sheet" data-close>✕</div>
    <div class="sheet-handle"></div>
    <div style="font-size:12px; font-weight:800; color:var(--muted);">حوار ${d.n}</div>
    <h2>${d.title}</h2>
    <div style="margin:10px 0 16px 0;">
      <button class="cta small ghost" data-speak="${escapeHtml(fullText)}" style="display:inline-flex; align-items:center; gap:8px;">
        ${SPEAK_ICON} الاستماع للحوار كاملا
      </button>
    </div>
    ${d.lines.map(l=>`
      <div class="dialogue-line ${l.who}">
        <div class="who">${l.who==='a'?'أ':'ب'}</div>
        <div class="dialogue-bubble">
          <span class="fr" style="display:block; font-size:14.5px; font-weight:600;">${l.fr}</span>
          <span style="display:block; font-size:12px; color:var(--muted); margin-top:3px;">${l.ar}</span>
        </div>
        <button class="speak-btn" data-speak="${escapeHtml(l.fr)}">${SPEAK_ICON}</button>
      </div>
    `).join('')}
    <div class="mark-done-row">
      <button class="cta ${done?'ghost':''}" id="markDialogueBtn" data-n="${d.n}" style="flex:1;">
        ${done ? 'تمت قراءته ✓' : 'أنهيت قراءة هذا الحوار'}
      </button>
    </div>
  `;
}

function storySheetHtml(s){
  const done = !!state.stories[s.n];
  return `
    <div class="close-sheet" data-close>✕</div>
    <div class="sheet-handle"></div>
    <div style="font-size:12px; font-weight:800; color:var(--muted);">قصة ${s.n} من ${STORIES.length}</div>
    <h2>${s.title}</h2>
    <div class="story-fr">
      <p class="fr">${s.fr}</p>
      <div style="margin-top:12px;">
        <button class="speak-btn big" data-speak="${escapeHtml(s.fr)}">${SPEAK_ICON}</button>
      </div>
    </div>
    <button class="toggle-ar" data-toggle-ar>إظهار الترجمة العربية</button>
    <div class="story-ar" id="storyArBox">
      <p>${s.ar}</p>
    </div>
    <div class="q-box">
      <div class="lbl">سؤال الفهم</div>
      <p style="margin:0; font-size:14px; font-weight:700;">${s.q}</p>
    </div>
    <div class="mark-done-row">
      <button class="cta ${done?'ghost':''}" id="markStoryBtn" data-n="${s.n}" style="flex:1;">
        ${done ? 'تمت قراءتها ✓' : 'أنهيت قراءة هذه القصة'}
      </button>
    </div>
  `;
}

function newsSheetHtml(s){
  const done = !!state.news[s.n];
  return `
    <div class="close-sheet" data-close>✕</div>
    <div class="sheet-handle"></div>
    <div style="font-size:12px; font-weight:800; color:var(--muted);">خبر ${s.n} من ${NEWS.length}</div>
    <h2>${s.title}</h2>
    <div class="story-fr">
      <p class="fr">${s.fr}</p>
      <div style="margin-top:12px;">
        <button class="speak-btn big" data-speak="${escapeHtml(s.fr)}">${SPEAK_ICON}</button>
      </div>
    </div>
    <button class="toggle-ar" data-toggle-ar>إظهار الترجمة العربية</button>
    <div class="story-ar" id="storyArBox">
      <p>${s.ar}</p>
    </div>
    <div class="q-box">
      <div class="lbl">سؤال الفهم</div>
      <p style="margin:0; font-size:14px; font-weight:700;">${s.q}</p>
    </div>
    <div class="mark-done-row">
      <button class="cta ${done?'ghost':''}" id="markNewsBtn" data-n="${s.n}" style="flex:1;">
        ${done ? 'تمت قراءته ✓' : 'أنهيت قراءة هذا الخبر'}
      </button>
    </div>

/* ======================= QUIZ ======================= */
function renderQuiz(){
  return `
  <div class="section-title">الاختبار النهائي</div>
  <div class="card" style="margin-bottom:16px;">
    <p style="margin:0; font-size:13.5px; color:var(--ink-soft); line-height:1.8;">
      أجب عن الأسئلة التالية بنفسك أولا، ثم اضغط «إظهار الإجابة النموذجية» للمقارنة.
    </p>
  </div>
  ${QUIZ.map((q,i)=>`
    <div class="quiz-item">
      <div class="qn">سؤال ${i+1}</div>
      <p class="question">${q.q}</p>
      <textarea placeholder="اكتب إجابتك..."></textarea>
      <button class="reveal-link" data-reveal="${i}">إظهار الإجابة النموذجية</button>
      <div class="model-answer" id="answer-${i}">${q.a}</div>
    </div>
  `).join('')}
  <button class="cta" id="finishQuizBtn">${state.quizDone ? 'تم إنهاء الاختبار ✓' : 'أنهيت الاختبار النهائي'}</button>
  `;
}

/* ======================= DICTIONARY ======================= */
function renderDictionary(){
  return `
  <div class="section-title">قاموس النجاة</div>
  <div class="search-wrap">
    <input type="text" id="dictSearch" placeholder="ابحث عن كلمة بالفرنسية أو العربية..." />
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
  </div>
  <div class="card" id="dictList">${renderDictRows(DICTIONARY)}</div>
  `;
}
function renderDictRows(list){
  if(!list.length) return `<div class="empty-note">لا توجد نتائج مطابقة</div>`;
  return list.map(d=>`
    <div class="dict-row">
      <button class="speak-btn" data-speak="${escapeHtml(d.fr)}">${SPEAK_ICON}</button>
      <div>
        <div class="fr">${d.fr}</div>
        <div class="ar">${d.ar}</div>
      </div>
      <span class="dict-cat">${d.cat}</span>
    </div>
  `).join('');
}

/* ======================= EVENT WIRING ======================= */
function attachViewHandlers(route){
  document.querySelectorAll('[data-speak]').forEach(b=>{
    b.addEventListener('click', ()=> speak(b.dataset.speak));
  });

  if(route==='home'){
    const cb = document.getElementById('continueBtn');
    if(cb) cb.addEventListener('click', ()=> openLessonSheet(parseInt(cb.dataset.n)));
    const qb = document.getElementById('goQuizBtn');
    if(qb) qb.addEventListener('click', ()=> navigate('quiz'));
    document.querySelectorAll('[data-plan]').forEach(el=>{
      el.addEventListener('click', ()=>{
        const i = el.dataset.plan;
        if(state.plan[i]) delete state.plan[i]; else { state.plan[i]=true; bumpStreak(); addXp(5); }
        saveState();
        document.getElementById('view').innerHTML = renderHome();
        attachViewHandlers('home');
      });
    });
  }

  if(route==='lessons'){
    document.querySelectorAll('[data-level]').forEach(t=>{
      t.addEventListener('click', ()=>{
        currentLessonLevel = t.dataset.level;
        document.getElementById('view').innerHTML = renderLessons();
        attachViewHandlers('lessons');
      });
    });
    document.querySelectorAll('[data-toggle]').forEach(head=>{
      head.addEventListener('click', ()=>{
        document.getElementById('chapter-'+head.dataset.toggle).classList.toggle('open');
      });
    });
    document.querySelectorAll('[data-lesson]').forEach(row=>{
      row.addEventListener('click', ()=> openLessonSheet(parseInt(row.dataset.lesson)));
    });
    // auto-open the sub-level containing the next lesson, within the current level tab
    const nx = nextLesson();
    if(nx){
      const lv = levelOf(nx.n);
      if(lv.level === currentLessonLevel){
        const el = document.getElementById('chapter-'+lv.level+'-'+lv.sub);
        if(el) el.classList.add('open');
      }
    }
  }

  if(route==='reading'){
    document.querySelectorAll('[data-readtab]').forEach(t=>{
      t.addEventListener('click', ()=>{
        document.getElementById('view').innerHTML = renderReading(t.dataset.readtab);
        attachViewHandlers('reading');
      });
    });
    document.querySelectorAll('[data-dialogue]').forEach(row=>{
      row.addEventListener('click', ()=> openDialogueSheet(parseInt(row.dataset.dialogue)));
    });
    document.querySelectorAll('[data-story]').forEach(row=>{
      row.addEventListener('click', ()=> openStorySheet(parseInt(row.dataset.story)));
    });
    document.querySelectorAll('[data-news]').forEach(row=>{
      row.addEventListener('click', ()=> openNewsSheet(parseInt(row.dataset.news)));
    });
  }

  if(route==='quiz'){
    document.querySelectorAll('[data-reveal]').forEach(btn=>{
      btn.addEventListener('click', ()=>{
        document.getElementById('answer-'+btn.dataset.reveal).classList.toggle('show');
      });
    });
    const fb = document.getElementById('finishQuizBtn');
    if(fb) fb.addEventListener('click', ()=>{
      state.quizDone = true; bumpStreak(); addXp(20); saveState();
      showToast("🎉 أحسنت! أنهيت الاختبار النهائي");
      document.getElementById('view').innerHTML = renderQuiz();
      attachViewHandlers('quiz');
    });
  }

  if(route==='dictionary'){
    const input = document.getElementById('dictSearch');
    input.addEventListener('input', ()=>{
      const q = input.value.trim().toLowerCase();
      const filtered = DICTIONARY.filter(d => d.fr.toLowerCase().includes(q) || d.ar.includes(q));
      document.getElementById('dictList').innerHTML = renderDictRows(filtered);
      document.querySelectorAll('[data-speak]').forEach(b=>{
        b.addEventListener('click', ()=> speak(b.dataset.speak));
      });
    });
  }
}

function openLessonSheet(n){
  const l = LESSONS.find(x=>x.n===n);
  if(!l) return;
  openSheet(lessonSheetHtml(l));
  document.querySelectorAll('[data-speak]').forEach(b=> b.addEventListener('click', ()=> speak(b.dataset.speak)));
  document.querySelector('[data-close]').addEventListener('click', closeSheet);
  document.getElementById('markLessonBtn').addEventListener('click', ()=>{
    if(state.lessons[n]) delete state.lessons[n];
    else { state.lessons[n]=true; bumpStreak(); addXp(10); showToast("أحسنت! تم إنهاء الدرس"); }
    saveState();
    closeSheet();
    navigate(currentRoute);
  });
}
function openDialogueSheet(n){
  const d = DIALOGUES.find(x=>x.n===n);
  if(!d) return;
  openSheet(dialogueSheetHtml(d));
  document.querySelectorAll('[data-speak]').forEach(b=> b.addEventListener('click', ()=> speak(b.dataset.speak)));
  document.querySelector('[data-close]').addEventListener('click', closeSheet);
  document.getElementById('markDialogueBtn').addEventListener('click', ()=>{
    if(state.dialogues[n]) delete state.dialogues[n];
    else { state.dialogues[n]=true; bumpStreak(); addXp(8); showToast("رائع! أنهيت هذا الحوار"); }
    saveState();
    closeSheet();
    currentReadingTab='dialogues';
    navigate('reading');
  });
}
function openStorySheet(n){
  const s = STORIES.find(x=>x.n===n);
  if(!s) return;
  openSheet(storySheetHtml(s));
  document.querySelectorAll('[data-speak]').forEach(b=> b.addEventListener('click', ()=> speak(b.dataset.speak)));
  document.querySelector('[data-close]').addEventListener('click', closeSheet);
  document.querySelector('[data-toggle-ar]').addEventListener('click', (e)=>{
    document.getElementById('storyArBox').classList.toggle('show');
    e.target.textContent = document.getElementById('storyArBox').classList.contains('show') ? 'إخفاء الترجمة العربية' : 'إظهار الترجمة العربية';
  });
  document.getElementById('markStoryBtn').addEventListener('click', ()=>{
    if(state.stories[n]) delete state.stories[n];
    else { state.stories[n]=true; bumpStreak(); addXp(12); showToast("ممتاز! أنهيت هذه القصة"); }
    saveState();
    closeSheet();
    currentReadingTab='stories';
    navigate('reading');
  });
}
function openNewsSheet(n){
  const s = NEWS.find(x=>x.n===n);
  if(!s) return;
  openSheet(newsSheetHtml(s));
  document.querySelectorAll('[data-speak]').forEach(b=> b.addEventListener('click', ()=> speak(b.dataset.speak)));
  document.querySelector('[data-close]').addEventListener('click', closeSheet);
  document.querySelector('[data-toggle-ar]').addEventListener('click', (e)=>{
    document.getElementById('storyArBox').classList.toggle('show');
    e.target.textContent = document.getElementById('storyArBox').classList.contains('show') ? 'إخفاء الترجمة العربية' : 'إظهار الترجمة العربية';
  });
  document.getElementById('markNewsBtn').addEventListener('click', ()=>{
    if(state.news[n]) delete state.news[n];
    else { state.news[n]=true; bumpStreak(); addXp(10); showToast("رائع! أنهيت قراءة هذا الخبر"); }
    saveState();
    closeSheet();
    currentReadingTab='news';
    navigate('reading');
  });
}

/* ======================= INIT ======================= */
navigate('home');

if('serviceWorker' in navigator){
  window.addEventListener('load', ()=>{
    navigator.serviceWorker.register('service-worker.js').catch(()=>{});
  });
}
</script>
